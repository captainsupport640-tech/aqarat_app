name: aqarat Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Windows Release
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        CXXFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        CFLAGS: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      run: flutter build windows --release

    - name: Compress Build Output
      shell: pwsh
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Aqarat-Windows-Release.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aqarat-Windows-App
        path: Aqarat-Windows-Release.zip